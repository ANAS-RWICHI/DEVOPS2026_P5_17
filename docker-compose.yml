# docker compose up --build
#   1. mlflow   : tracking server and model registry      http://localhost:5000
#   2. pipeline : fetches the raw data (dvc pull), runs the DVC pipeline, then exits
#   3. api      : serves the production model             http://localhost:8000/docs

x-app: &app
  build: .
  image: demand-forecast:latest

services:
  mlflow:
    <<: *app
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  pipeline:
    <<: *app
    # --force: the registry lives in a Docker volume, so a cached DVC stage
    # must not skip the training that fills it. Use plain `dvc repro` locally.
    # The raw Kaggle file comes from the DVC remote unless it is already there.
    command: sh -c "(test -f data/raw/train.csv || dvc pull data/raw/train.csv.dvc) && dvc repro --force"
    user: root
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    <<: *app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mlflow-data:
