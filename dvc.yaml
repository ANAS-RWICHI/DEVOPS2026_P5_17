stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - src/data/prepare.py
      - data/raw/train.csv
    outs:
      - data/processed/sales_clean.csv

  featurize:
    cmd: python -m src.features
    deps:
      - src/features.py
      - data/processed/sales_clean.csv
    params:
      - features
    outs:
      - data/features/train.csv
      - data/features/test.csv

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/models.py
      - data/features/train.csv
    params:
      - train
      - mlflow
    outs:
      - models/model.pkl
      - models/run.json

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - models/model.pkl
      - models/run.json
      - data/features/test.csv
    metrics:
      - metrics/metrics.json:
          cache: false
    plots:
      - metrics/pred_vs_actual.png
